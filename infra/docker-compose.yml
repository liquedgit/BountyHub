name: bountyhub

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bountyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bountyhub}
    networks: [internal]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [internal]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bountyhub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-bountyhub}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"__import__('urllib.request').request.urlopen('http://127.0.0.1:8000/health',timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [internal]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [edge, internal]
    environment:
      API_INTERNAL_URL: http://backend:8000
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Quick tunnel: random https://<words>.trycloudflare.com URL, new on every start.
  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.0
    profiles: [tunnel-quick]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [edge]
    depends_on:
      - frontend

  # Named tunnel: stable hostname configured in the Cloudflare dashboard.
  tunnel-named:
    image: docker.io/cloudflare/cloudflared:2026.10.0
    profiles: [tunnel-named]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [edge]
    depends_on:
      - frontend

networks:
  edge:
  internal:

volumes:
  pgdata:
